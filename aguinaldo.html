<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Aguinaldo | LaboralMX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center py-3">
                        <h3 class="mb-0">Calculadora de Aguinaldo</h3>
                        <small>Mínimo de ley: 15 días por año trabajado</small>
                    </div>
                    <div class="card-body p-4">
                        
                        <!-- Formulario -->
                        <form id="formAguinaldo">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Sueldo Mensual Libre (Neto)</label>
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input type="number" class="form-control" id="sueldo" placeholder="Ej. 12000" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">¿Trabajaste todo el año en la empresa?</label>
                                <select class="form-select" id="tipoPeriodo" onchange="toggleDias()">
                                    <option value="completo">Sí, trabajé el año completo (365 días)</option>
                                    <option value="proporcional">No, entré a trabajar a mediados de año</option>
                                </select>
                            </div>

                            <div class="mb-4 d-none" id="divDias">
                                <label class="form-label fw-bold">¿Cuántos días trabajaste este año?</label>
                                <input type="number" class="form-control" id="diasTrabajados" value="365" max="365">
                            </div>

                            <button type="button" class="btn btn-success w-100 fw-bold fs-5" onclick="calcularAguinaldo()">
                                Calcular mi Aguinaldo
                            </button>
                        </form>

                        <!-- Resultado -->
                        <div id="resultado" class="mt-4 alert alert-success d-none text-center">
                            <h5>Te corresponden aproximadamente:</h5>
                            <h2 class="fw-bold text-success" id="montoFinal">$0.00</h2>
                            <p class="mb-0 text-muted small">Cálculo basado en el Art. 87 de la LFT.</p>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Lógica Matemática en JavaScript -->
    <script>
        function toggleDias() {
            let seleccion = document.getElementById('tipoPeriodo').value;
            let divDias = document.getElementById('divDias');
            let inputDias = document.getElementById('diasTrabajados');
            
            if (seleccion === 'proporcional') {
                divDias.classList.remove('d-none');
                inputDias.value = ""; // Limpiar para que el usuario escriba
            } else {
                divDias.classList.add('d-none');
                inputDias.value = 365;
            }
        }

        function calcularAguinaldo() {
            let sueldoMensual = parseFloat(document.getElementById('sueldo').value);
            let diasTrabajados = parseFloat(document.getElementById('diasTrabajados').value);

            if (isNaN(sueldoMensual) || sueldoMensual <= 0) {
                alert("Por favor, ingresa un sueldo válido.");
                return;
            }

            // FÓRMULA LEY FEDERAL DEL TRABAJO
            let salarioDiario = sueldoMensual / 30; // 1. Sacar lo que gana al día
            let diasAguinaldoLey = 15; // 2. La ley marca 15 días mínimo
            let proporcionPorDia = diasAguinaldoLey / 365; // 3. Cuánto aguinaldo se gana por 1 día trabajado
            
            let totalAguinaldo = (salarioDiario * proporcionPorDia) * diasTrabajados;

            // Mostrar el resultado en pantalla
            document.getElementById('montoFinal').innerText = "$" + totalAguinaldo.toLocaleString('es-MX', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            document.getElementById('resultado').classList.remove('d-none');
        }
    </script>
</body>
</html>
